services:
  web:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app:Z
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps with Hot Module Replacement in Docker
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: portfolio_cms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
