services:
  web:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app:Z
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps with Hot Module Replacement in Docker
      # Backend runs on the host; the browser calls it directly (allowed by PUBLIC_ORIGINS).
      - VITE_API_URL=http://localhost:5000
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_cms}
    ports:
      # Loopback only: the database must never be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
